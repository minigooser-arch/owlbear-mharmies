name: Apply ship route grid wiring fix

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - .github/workflows/apply-ship-route-grid-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
      - name: Patch ProductionEngine grid setup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/background/application.ts')
          text = path.read_text()
          old = 'if (command.type === "COMPLETE_TURN_NOW" || command.type === "REGISTER_SHIP" || command.type === "NAVAL_MOVE_FORWARD") {'
          new = 'if (command.type === "COMPLETE_TURN_NOW" || command.type === "REGISTER_SHIP" || command.type === "SET_SHIP_ROUTE" || command.type === "NAVAL_MOVE_FORWARD") {'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one grid setup condition, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-ship-route-grid-fix.yml
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/background/application.ts .github/workflows/apply-ship-route-grid-fix.yml
          git commit -m 'fix: provide grid adapter for ship routes'
          git push origin HEAD:feature/naval-combat-v1
