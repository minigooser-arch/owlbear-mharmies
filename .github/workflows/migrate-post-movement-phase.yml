name: Migrate Post Movement Phase

on:
  push:
    branches: [feature/naval-stage2-runtime]
    paths:
      - scripts/migrate-post-movement-phase.mjs
      - .github/workflows/migrate-post-movement-phase.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/migrate-post-movement-phase.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 1
          git commit -m "refactor: use post-movement global naval phase"
          git push origin HEAD:feature/naval-stage2-runtime
