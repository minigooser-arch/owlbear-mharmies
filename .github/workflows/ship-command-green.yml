name: Apply ship command green patch

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - .github/workflows/ship-command-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - run: python scripts/apply-ship-command-green.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/types.ts src/commands/commandValidation.ts src/commands/commandProcessor.ts
          git rm scripts/apply-ship-command-green.py
          git rm .github/workflows/ship-command-green.yml
          git commit -m "feat: add authoritative ship registration commands"
          git push origin HEAD:feature/naval-combat-v1
