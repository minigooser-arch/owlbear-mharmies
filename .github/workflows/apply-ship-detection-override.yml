name: Apply ship detection override

on:
  push:
    branches: [feature/naval-combat-v1]
    paths:
      - .github/workflows/apply-ship-detection-override.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply ship detection override
        run: python3 scripts/apply-ship-detection-override.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-ship-detection-override.py .github/workflows/apply-ship-detection-override.yml
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/types.ts src/commands/commandValidation.ts src/commands/commandProcessor.ts
          git commit -m "feat: add GM ship detection override command"
          git push origin HEAD:feature/naval-combat-v1
