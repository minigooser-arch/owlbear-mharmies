name: Ship facing rotation persistence

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - scripts/apply-ship-facing-rotation-persistence.py
      - .github/workflows/ship-facing-rotation-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply ship rotation persistence
        run: python scripts/apply-ship-facing-rotation-persistence.py
      - name: Commit ship rotation persistence
        run: |
          rm -f scripts/apply-ship-facing-rotation-persistence.py .github/workflows/ship-facing-rotation-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist ship facing rotation"
          git push origin HEAD:feature/naval-combat-v1
