name: Active destroyed ship turn advance

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - scripts/apply-active-destroyed-ship-turn-advance.py
      - .github/workflows/active-destroyed-ship-turn-advance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply destroyed ship turn advance
        run: python scripts/apply-active-destroyed-ship-turn-advance.py
      - name: Commit destroyed ship turn advance
        run: |
          rm -f scripts/apply-active-destroyed-ship-turn-advance.py .github/workflows/active-destroyed-ship-turn-advance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: advance naval turn after active ship destruction"
          git push origin HEAD:feature/naval-combat-v1
