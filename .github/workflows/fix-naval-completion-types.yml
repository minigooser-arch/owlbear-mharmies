name: Fix naval completion types

on:
  push:
    branches: [feature/naval-combat-v1]
    paths:
      - scripts/fix-naval-completion-types.py
      - .github/workflows/fix-naval-completion-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
      - run: python scripts/fix-naval-completion-types.py
      - run: rm scripts/fix-naval-completion-types.py .github/workflows/fix-naval-completion-types.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: keep naval completion ships strongly typed"
          git push
