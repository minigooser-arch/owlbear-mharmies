name: Temporary npm audit lockfile fix

on:
  push:
    branches:
      - fix/post-stage2-hardening
    paths:
      - .github/workflows/audit-fix-temp.yml

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit fix --package-lock-only
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh vulnerable transitive dependencies"
          git push
