name: Embarked supply RED

on:
  push:
    branches:
      - feature/naval-combat-v1

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx vitest run src/turns/embarkedArmySupply.test.ts
