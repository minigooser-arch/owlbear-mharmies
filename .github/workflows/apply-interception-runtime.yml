name: Apply interception runtime wiring

on:
  push:
    branches:
      - feature/naval-stage2-runtime
    paths:
      - .github/workflows/apply-interception-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: python scripts/apply-interception-runtime.py
      - run: npm ci
      - run: npm run check
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git commit -m "feat: wire interception overlay into runtime"
          git push origin HEAD:feature/naval-stage2-runtime
