name: Apply terrain and turn updates
on:
  push:
    branches: [feature/terrain-types-turn-number]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/terrain-types-turn-number
          fetch-depth: 0
      - name: Apply scoped source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('src/shared/types.ts',
              '    | { type: "COMPLETE_TURN_NOW" }\n',
              '    | { type: "SET_TURN_NUMBER"; turnNumber: number }\n    | { type: "COMPLETE_TURN_NOW" }\n')

          replace('src/commands/commandValidation.ts',
              '  RESUME_AUTO_TURNS: () => ({ type: "RESUME_AUTO_TURNS" }),\n  COMPLETE_TURN_NOW: () => ({ type: "COMPLETE_TURN_NOW" })',
              '  RESUME_AUTO_TURNS: () => ({ type: "RESUME_AUTO_TURNS" }),\n  SET_TURN_NUMBER: (value) => Number.isInteger(value.turnNumber) && (value.turnNumber as number) >= 1\n    ? { type: "SET_TURN_NUMBER", turnNumber: value.turnNumber as number }\n    : undefined,\n  COMPLETE_TURN_NOW: () => ({ type: "COMPLETE_TURN_NOW" })')

          replace('src/turns/turnService.ts',
              'export function pauseAutoTurns(turn: TurnState): TurnState {\n  return { ...turn, autoTurnsPaused: true, deferredUntil: null };\n}\n',
              'export function setTurnNumber(turn: TurnState, turnNumber: number): TurnState {\n  if (!Number.isInteger(turnNumber) || turnNumber < 1) throw new Error("INVALID_TURN_NUMBER");\n  return { ...turn, turnNumber };\n}\n\nexport function pauseAutoTurns(turn: TurnState): TurnState {\n  return { ...turn, autoTurnsPaused: true, deferredUntil: null };\n}\n')

          replace('src/commands/commandProcessor.ts',
              'import { cancelTurnDeferral, completeTurn, deferTurn, pauseAutoTurns, resumeAutoTurns } from "../turns/turnService";',
              'import { cancelTurnDeferral, completeTurn, deferTurn, pauseAutoTurns, resumeAutoTurns, setTurnNumber } from "../turns/turnService";')

          replace('src/commands/commandProcessor.ts',
              '      case "RESUME_AUTO_TURNS":\n        state.scene.turn = resumeAutoTurns(state.scene.turn, this.now());\n        return undefined;\n      case "COMPLETE_TURN_NOW": {',
              '      case "RESUME_AUTO_TURNS":\n        state.scene.turn = resumeAutoTurns(state.scene.turn, this.now());\n        return undefined;\n      case "SET_TURN_NUMBER": {\n        state.scene.turn = setTurnNumber(state.scene.turn, command.turnNumber);\n        for (const [armyId, army] of Object.entries(state.armies)) {\n          if (army.plannedRoute.executeOnTurn === 0 || army.plannedRoute.executeOnTurn === command.turnNumber) continue;\n          state.armies[armyId] = bumpArmy(army, {\n            plannedRoute: { ...army.plannedRoute, requiresReplan: true }\n          });\n        }\n        return undefined;\n      }\n      case "COMPLETE_TURN_NOW": {')

          p = Path('src/storage/migrations.ts')
          text = p.read_text()
          old = '''function ensureBuiltInSeaTerrain(value: unknown): unknown {\n  if (!isRecord(value) || !isRecord(value.types)) return structuredClone(DEFAULT_TERRAIN);\n  const defaultSea = DEFAULT_TERRAIN.types.sea;\n  if (!defaultSea) return value;\n  const existingSea = value.types.sea;\n  return {\n    ...value,\n    types: {\n      ...value.types,\n      sea: {\n        ...structuredClone(defaultSea),\n        ...(isRecord(existingSea) ? existingSea : {}),\n        id: "sea",\n        movementDomains: ["SEA"],\n        blocksNavalLos: false\n      }\n    }\n  };\n}\n'''
          new = '''function ensureBuiltInTerrains(value: unknown): unknown {\n  if (!isRecord(value) || !isRecord(value.types)) return structuredClone(DEFAULT_TERRAIN);\n  const types: Record<string, unknown> = { ...value.types };\n  for (const [id, defaultTerrain] of Object.entries(DEFAULT_TERRAIN.types)) {\n    const existing = types[id];\n    types[id] = {\n      ...structuredClone(defaultTerrain),\n      ...(isRecord(existing) ? existing : {}),\n      id,\n      ...(id === "sea" ? { movementDomains: ["SEA"], blocksNavalLos: false } : {}),\n      ...(id === "ice" ? { movementDomains: ["LAND"], blocksNavalLos: true } : {})\n    };\n  }\n  return { ...value, types };\n}\n'''
          if 'function ensureBuiltInTerrains' not in text:
              if old not in text:
                  raise SystemExit('terrain migration helper pattern not found')
              text = text.replace(old, new, 1)
              text = text.replace('terrain: ensureBuiltInSeaTerrain(migrated.terrain)', 'terrain: ensureBuiltInTerrains(migrated.terrain)', 1)
              p.write_text(text)

          Path('.github/workflows/apply-terrain-turn.yml').unlink()
          PY
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: support terrain palette and manual turn number"
          git push origin HEAD:feature/terrain-types-turn-number
