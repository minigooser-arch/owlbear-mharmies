name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply coordinator acquisition fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/coordinator-lease-acquisition'
        shell: bash
        run: python3 -c "from pathlib import Path; import base64; p=Path('src/background/application.ts'); t=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in t or new in t; p.write_text(t.replace(old,new,1) if old in t else t)"
      - name: Commit coordinator acquisition fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/coordinator-lease-acquisition'
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git commit -m "fix: allow initial coordinator lease acquisition"
          git push
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
