name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/terrain-visibility-turn-number
      - name: Apply implementation patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_string, old, new):
              path = Path(path_string)
              content = path.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"Expected patch anchor not found in {path_string}: {old[:80]!r}")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/shared/types.ts",
              '    | { type: "RESUME_AUTO_TURNS" }\n    | { type: "COMPLETE_TURN_NOW" }',
              '    | { type: "RESUME_AUTO_TURNS" }\n    | { type: "SET_TURN_NUMBER"; turnNumber: number }\n    | { type: "COMPLETE_TURN_NOW" }'
          )
          replace_once(
              "src/commands/commandValidation.ts",
              '  RESUME_AUTO_TURNS: () => ({ type: "RESUME_AUTO_TURNS" }),\n  COMPLETE_TURN_NOW: () => ({ type: "COMPLETE_TURN_NOW" })',
              '  RESUME_AUTO_TURNS: () => ({ type: "RESUME_AUTO_TURNS" }),\n  SET_TURN_NUMBER: (value) => Number.isInteger(value.turnNumber) && (value.turnNumber as number) >= 1\n    ? { type: "SET_TURN_NUMBER", turnNumber: value.turnNumber as number }\n    : undefined,\n  COMPLETE_TURN_NOW: () => ({ type: "COMPLETE_TURN_NOW" })'
          )
          replace_once(
              "src/commands/commandProcessor.ts",
              '      case "RESUME_AUTO_TURNS":\n        state.scene.turn = resumeAutoTurns(state.scene.turn, this.now());\n        return undefined;\n      case "COMPLETE_TURN_NOW": {',
              '      case "RESUME_AUTO_TURNS":\n        state.scene.turn = resumeAutoTurns(state.scene.turn, this.now());\n        return undefined;\n      case "SET_TURN_NUMBER": {\n        if (!Number.isInteger(command.turnNumber) || command.turnNumber < 1) return "INVALID_COMMAND";\n        if (state.scene.turn.turnNumber === command.turnNumber) return undefined;\n        state.scene.turn = { ...state.scene.turn, turnNumber: command.turnNumber };\n        for (const [armyId, army] of Object.entries(state.armies)) {\n          if (army.plannedRoute.cells.length === 0) continue;\n          state.armies[armyId] = bumpArmy(army, {\n            plannedRoute: { ...army.plannedRoute, requiresReplan: true }\n          });\n        }\n        return undefined;\n      }\n      case "COMPLETE_TURN_NOW": {'
          )
          replace_once(
              "src/terrain/mapOverlayService.ts",
              '              strokeColor: terrain.color ?? "#42a5f5",\n              metadata: marker.metadata',
              '              fillColor: terrain.color ?? "#42a5f5",\n              fillOpacity: 0.24,\n              strokeColor: terrain.color ?? "#42a5f5",\n              strokeOpacity: 0.95,\n              strokeWidth: 4,\n              metadata: marker.metadata'
          )
          replace_once(
              "src/owlbear/sdkAdapter.ts",
              '''  if (item.type === "CURVE") {
    const style = objectRecord(item.style);
    return typeof style.strokeColor === "string"
      ? { ...item, strokeColor: style.strokeColor }
      : item;
  }''',
              '''  if (item.type === "CURVE") {
    const style = objectRecord(item.style);
    return {
      ...item,
      ...(typeof style.fillColor === "string" ? { fillColor: style.fillColor } : {}),
      ...(typeof style.fillOpacity === "number" ? { fillOpacity: style.fillOpacity } : {}),
      ...(typeof style.strokeColor === "string" ? { strokeColor: style.strokeColor } : {}),
      ...(typeof style.strokeOpacity === "number" ? { strokeOpacity: style.strokeOpacity } : {}),
      ...(typeof style.strokeWidth === "number" ? { strokeWidth: style.strokeWidth } : {})
    };
  }'''
          )
          replace_once(
              "src/owlbear/sdkAdapter.ts",
              '''  if (source.type === "CURVE" && draft.type === "CURVE") {
    if (hasOwn(source, "points")) draft.points = structuredClone(source.points);
    if (hasOwn(source, "strokeColor")) {
      draft.style = {
        ...objectRecord(draft.style),
        strokeColor: source.strokeColor
      };
    }
  }''',
              '''  if (source.type === "CURVE" && draft.type === "CURVE") {
    if (hasOwn(source, "points")) draft.points = structuredClone(source.points);
    if (
      hasOwn(source, "fillColor") ||
      hasOwn(source, "fillOpacity") ||
      hasOwn(source, "strokeColor") ||
      hasOwn(source, "strokeOpacity") ||
      hasOwn(source, "strokeWidth")
    ) {
      draft.style = {
        ...objectRecord(draft.style),
        ...(hasOwn(source, "fillColor") ? { fillColor: source.fillColor } : {}),
        ...(hasOwn(source, "fillOpacity") ? { fillOpacity: source.fillOpacity } : {}),
        ...(hasOwn(source, "strokeColor") ? { strokeColor: source.strokeColor } : {}),
        ...(hasOwn(source, "strokeOpacity") ? { strokeOpacity: source.strokeOpacity } : {}),
        ...(hasOwn(source, "strokeWidth") ? { strokeWidth: source.strokeWidth } : {})
      };
    }
  }'''
          )
          replace_once(
              "src/owlbear/sdkAdapter.ts",
              '      .points(points.map((point) => ({ ...point })))\n      .fillOpacity(numeric(source.fillOpacity, 0))',
              '      .points(points.map((point) => ({ ...point })))\n      .fillColor(typeof source.fillColor === "string" ? source.fillColor : "#ffffff")\n      .fillOpacity(numeric(source.fillOpacity, 0))'
          )
          replace_once(
              "src/storage/migrations.ts",
              '''function ensureBuiltInSeaTerrain(value: unknown): unknown {
  if (!isRecord(value) || !isRecord(value.types)) return structuredClone(DEFAULT_TERRAIN);
  const defaultSea = DEFAULT_TERRAIN.types.sea;
  if (!defaultSea) return value;
  const existingSea = value.types.sea;
  return {
    ...value,
    types: {
      ...value.types,
      sea: {
        ...structuredClone(defaultSea),
        ...(isRecord(existingSea) ? existingSea : {}),
        id: "sea",
        movementDomains: ["SEA"],
        blocksNavalLos: false
      }
    }
  };
}''',
              '''function ensureBuiltInTerrainCatalog(value: unknown): unknown {
  if (!isRecord(value) || !isRecord(value.types)) return structuredClone(DEFAULT_TERRAIN);

  const legacyDefaults: Record<string, { name?: string; color?: string }> = {
    plain: { name: "Равнина", color: "#90a4ae" },
    forest: { color: "#66bb6a" },
    mountains: { color: "#8d6e63" },
    sea: { name: "Море", color: "#42a5f5" }
  };
  const types: Record<string, unknown> = { ...value.types };

  for (const [id, defaultTerrain] of Object.entries(DEFAULT_TERRAIN.types)) {
    const existing = types[id];
    if (!isRecord(existing)) {
      types[id] = structuredClone(defaultTerrain);
      continue;
    }
    const legacy = legacyDefaults[id];
    const next: UnknownRecord = { ...existing, id };
    if (!Array.isArray(existing.movementDomains)) {
      next.movementDomains = structuredClone(defaultTerrain.movementDomains ?? ["LAND"]);
    }
    if (typeof existing.blocksNavalLos !== "boolean") {
      next.blocksNavalLos = defaultTerrain.blocksNavalLos ?? true;
    }
    if (legacy?.name !== undefined && existing.name === legacy.name) next.name = defaultTerrain.name;
    if (legacy?.color !== undefined && existing.color === legacy.color) next.color = defaultTerrain.color;
    types[id] = next;
  }

  const sea = types.sea;
  if (isRecord(sea)) {
    types.sea = { ...sea, id: "sea", movementDomains: ["SEA"], blocksNavalLos: false };
  }
  return { ...value, types };
}'''
          )
          replace_once(
              "src/storage/migrations.ts",
              '      terrain: ensureBuiltInSeaTerrain(migrated.terrain)',
              '      terrain: ensureBuiltInTerrainCatalog(migrated.terrain)'
          )
      - name: Commit implementation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/types.ts src/commands/commandValidation.ts src/commands/commandProcessor.ts src/terrain/mapOverlayService.ts src/owlbear/sdkAdapter.ts src/storage/migrations.ts
          git diff --cached --quiet || git commit -m "feat: implement terrain rendering and turn renumbering"
          git push origin HEAD:feat/terrain-visibility-turn-number
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
