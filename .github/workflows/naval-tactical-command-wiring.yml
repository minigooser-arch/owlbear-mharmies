name: Naval tactical command wiring

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - scripts/apply-naval-tactical-command-wiring-v2.py
      - .github/workflows/naval-tactical-command-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply naval tactical command wiring
        run: python scripts/apply-naval-tactical-command-wiring-v2.py
      - name: Commit naval tactical command wiring
        run: |
          rm -f scripts/apply-naval-tactical-command-wiring.py scripts/apply-naval-tactical-command-wiring-v2.py .github/workflows/naval-tactical-command-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire naval tactical commands"
          git push origin HEAD:feature/naval-combat-v1
