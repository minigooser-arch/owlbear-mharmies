name: UI Interaction Verification

on:
  push:
    branches:
      - fix/post-stage2-hardening
    paths:
      - .github/workflows/ui-interaction-verification.yml

permissions:
  contents: read

jobs:
  ui-interactions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run UI and Owlbear interaction tests
        run: >-
          npx vitest run
          src/ui
          src/owlbear
          src/background/routeToolService.test.ts
          src/background/shipRouteToolService.test.ts
          src/background/mapBrushToolService.test.ts
          src/background/navalBattleAreaToolService.test.ts
          src/background/navalInterceptionContextMenuService.test.ts
          src/background/indexInterceptionContextMenu.test.ts
          src/tests/fourClient.integration.test.ts
