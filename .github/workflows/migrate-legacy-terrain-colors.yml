name: Migrate legacy terrain colors safely
on:
  push:
    branches: [feature/terrain-types-turn-number]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/terrain-types-turn-number
      - name: Update legacy defaults only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/storage/migrations.ts')
          text = p.read_text()
          old = '''    types[id] = {\n      ...structuredClone(defaultTerrain),\n      ...(isRecord(existing) ? existing : {}),\n      id,\n      ...(id === "sea" ? { movementDomains: ["SEA"], blocksNavalLos: false } : {}),\n      ...(id === "ice" ? { movementDomains: ["LAND"], blocksNavalLos: true } : {})\n    };'''
          new = '''    const legacyDefaults: Record<string, { name: string; color: string }> = {\n      plain: { name: "Равнина", color: "#90a4ae" },\n      forest: { name: "Лес", color: "#66bb6a" },\n      mountains: { name: "Горы", color: "#8d6e63" },\n      sea: { name: "Море", color: "#42a5f5" }\n    };\n    const legacy = legacyDefaults[id];\n    const existingRecord = isRecord(existing) ? existing : undefined;\n    const migrateLegacyPresentation = legacy && existingRecord &&\n      existingRecord.name === legacy.name && existingRecord.color === legacy.color;\n    types[id] = {\n      ...structuredClone(defaultTerrain),\n      ...(existingRecord ?? {}),\n      ...(migrateLegacyPresentation ? { name: defaultTerrain.name, color: defaultTerrain.color } : {}),\n      id,\n      ...(id === "sea" ? { movementDomains: ["SEA"], blocksNavalLos: false } : {}),\n      ...(id === "ice" ? { movementDomains: ["LAND"], blocksNavalLos: true } : {})\n    };'''
          if new not in text:
              if old not in text:
                  raise SystemExit('expected migration block missing')
              text = text.replace(old, new, 1)
              p.write_text(text)
          Path('.github/workflows/migrate-legacy-terrain-colors.yml').unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: migrate legacy default terrain presentation"
          git push origin HEAD:feature/terrain-types-turn-number
