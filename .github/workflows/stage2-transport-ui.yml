name: Stage2 Transport UI Patch

on:
  push:
    branches: [feature/naval-stage2-runtime]
    paths:
      - scripts/stage2-transport-ui.mjs
      - .github/workflows/stage2-transport-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/stage2-transport-ui.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages/FleetPage.tsx src/ui/pages/ArmiesPage.tsx src/ui/pages/ForcesPage.tsx src/ui/App.tsx
          git diff --cached --quiet && exit 1
          git commit -m "feat: expose transport embark and consent UX"
          git push origin HEAD:feature/naval-stage2-runtime
