name: Apply ship detection editor

on:
  push:
    branches: [feature/naval-combat-v1]
    paths:
      - .github/workflows/apply-ship-detection-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply ship detection editor
        run: python3 scripts/apply-ship-detection-editor.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-ship-detection-editor.py .github/workflows/apply-ship-detection-editor.yml
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/state/useExtensionState.ts src/owlbear/extensionServices.ts src/ui/components/ShipCard.tsx src/ui/components/ShipCard.test.tsx src/ui/pages/FleetPage.test.tsx
          git commit -m "feat: add GM ship detection editor"
          git push origin HEAD:feature/naval-combat-v1
