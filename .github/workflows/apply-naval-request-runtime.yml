name: Apply naval request runtime patch

on:
  push:
    branches:
      - feature/naval-battle-request-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-battle-request-runtime
          fetch-depth: 0
      - name: Apply focused runtime patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_patch.py
          python /tmp/apply_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/background/application.ts; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git commit -m "feat: validate naval requests against live detection"
          git push origin HEAD:feature/naval-battle-request-runtime
