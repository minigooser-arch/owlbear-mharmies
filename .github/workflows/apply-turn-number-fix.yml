name: Apply turn-number safety patch

on:
  push:
    branches:
      - fix/turn-number-safety

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/turn-number-safety
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Apply source patch
        run: python3 scripts/apply-turn-number-fix.py
      - name: Update release metadata
        run: |
          npm version 1.2.1 --no-git-tag-version
          npm install --save-dev --save-exact vitest@4.1.11
      - name: Commit generated patch
        run: |
          rm scripts/apply-turn-number-fix.py
          rm .github/workflows/apply-turn-number-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make turn renumbering safe"
          git push origin HEAD:fix/turn-number-safety
