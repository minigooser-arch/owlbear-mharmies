name: Apply naval exit command

on:
  push:
    branches: [feature/naval-combat-v1]
    paths:
      - scripts/apply-naval-exit-command.py
      - .github/workflows/apply-naval-exit-command.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
      - name: Apply patch
        run: python3 scripts/apply-naval-exit-command.py
      - name: Remove one-shot files
        run: rm scripts/apply-naval-exit-command.py .github/workflows/apply-naval-exit-command.yml
      - name: Commit production command
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: confirm naval ship exits"
          git push origin HEAD:feature/naval-combat-v1
