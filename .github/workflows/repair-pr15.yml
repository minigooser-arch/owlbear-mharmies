name: Repair PR 15

on:
  push:
    branches:
      - fix/leader-ship-overlays-context-menu

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/leader-ship-overlays-context-menu
      - name: Repair application diff
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/background/application.ts")
          content = path.read_text(encoding="utf-8")
          broken = """        coordinatorConnectionId,\n        recipientConnectionId,\n        ...(result.status === \"REJECTED\" ? { reason: result.reason } : { actualRevision: result.actualRevision })"""
          repaired = """        coordinatorConnectionId,\n        recipientConnectionId: sender.connectionId,\n        ...(result.status === \"REJECTED\" ? { reason: result.reason } : { actualRevision: result.actualRevision })"""
          if broken not in content:
              raise SystemExit("Expected accidental shorthand not found")
          content = content.replace(broken, repaired, 1)
          path.write_text(content.rstrip("\n") + "\n", encoding="utf-8")
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git diff --cached --quiet || git commit -m "fix: restore command acknowledgement recipient"
          git push origin HEAD:fix/leader-ship-overlays-context-menu
