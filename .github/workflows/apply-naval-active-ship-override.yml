name: Apply naval active ship override

on:
  push:
    branches: [feature/naval-combat-v1]
    paths:
      - scripts/apply-naval-active-ship-override.py
      - .github/workflows/apply-naval-active-ship-override.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply active ship override patch
        run: python3 scripts/apply-naval-active-ship-override.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-naval-active-ship-override.py .github/workflows/apply-naval-active-ship-override.yml
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/types.ts src/commands/commandValidation.ts src/commands/commandProcessor.ts src/naval/battle/navalTurnOverride.ts
          git commit -m "feat: add GM naval active-ship override"
          git push origin HEAD:feature/naval-combat-v1
