name: Apply naval runtime patch

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - .github/workflows/naval-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - run: python scripts/apply-naval-runtime-patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git rm scripts/apply-naval-runtime-patch.py
          git rm .github/workflows/naval-runtime-patch.yml
          git commit -m "feat: connect naval overlays to visibility tick"
          git push origin HEAD:feature/naval-combat-v1
