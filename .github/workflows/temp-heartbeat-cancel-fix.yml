name: Temporary heartbeat cancellation fix

on:
  push:
    branches:
      - fix/coordinator-lease-acquisition

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Patch heartbeat cancellation semantics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/background/application.ts')
          text = path.read_text()
          old = '''      if (!claimIsCurrent()) throw new Error("Coordinator heartbeat claim is stale");
      const scene = await this.repository.readScene();
      if (!claimIsCurrent()) throw new Error("Coordinator heartbeat claim is stale");
      if (!leaseIsClaimable(scene)) {
        throw new Error("Coordinator lease is held by another live connection");
      }
      await this.repository.writeScene(
        { ...scene, coordinatorLease: heartbeat },
        scene.revision,
        (current) => claimIsCurrent() && leaseIsClaimable(current)
      );
'''
          new = '''      if (!claimIsCurrent()) return;
      const scene = await this.repository.readScene();
      if (!claimIsCurrent()) return;
      if (!leaseIsClaimable(scene)) {
        throw new Error("Coordinator lease is held by another live connection");
      }
      try {
        await this.repository.writeScene(
          { ...scene, coordinatorLease: heartbeat },
          scene.revision,
          (current) => claimIsCurrent() && leaseIsClaimable(current)
        );
      } catch (error) {
        // Coordinator shutdown invalidates an in-flight heartbeat. Treat that as
        // cancellation, while preserving real persistence/lease-acquisition failures.
        if (!claimIsCurrent()) return;
        throw error;
      }
'''
          if old not in text:
              raise SystemExit('target heartbeat block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit production fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git rm .github/workflows/temp-heartbeat-cancel-fix.yml
          git commit -m "fix: cancel stale coordinator heartbeats safely"
          git push
