name: Ship route runtime wiring

on:
  push:
    branches:
      - feature/naval-combat-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ hashFiles('scripts/apply-ship-route-runtime-wiring.py') != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Apply runtime wiring
        run: python3 scripts/apply-ship-route-runtime-wiring.py
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: wire ship route tool into runtime"
          git push origin HEAD:feature/naval-combat-v1
