name: Ship HP command wiring

on:
  push:
    branches:
      - feature/naval-combat-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Apply ship HP command wiring
        run: python3 scripts/apply-ship-hp-command.py
      - name: Commit ship HP command wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add gm ship hp command"
          git push origin HEAD:feature/naval-combat-v1
