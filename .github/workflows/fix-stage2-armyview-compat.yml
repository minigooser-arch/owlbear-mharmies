name: Fix Stage2 ArmyView Compatibility

on:
  push:
    branches: [feature/naval-stage2-runtime]
    paths:
      - scripts/fix-stage2-armyview-compat.mjs
      - .github/workflows/fix-stage2-armyview-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/fix-stage2-armyview-compat.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/state/useExtensionState.ts
          git diff --cached --quiet && exit 1
          git commit -m "fix: keep ArmyView embark field backward compatible"
          git push origin HEAD:feature/naval-stage2-runtime
