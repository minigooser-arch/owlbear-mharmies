name: Live iframe probe

on:
  push:
    branches:
      - 'fix/live-pages-probe'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Locate Chrome
        run: |
          which google-chrome
          google-chrome --version
      - name: Install browser driver library
        run: npm install --no-save puppeteer-core
      - name: Probe published popover in real iframes
        run: node scripts/probe-live-iframe.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
