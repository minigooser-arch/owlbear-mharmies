name: Stage2 Transport Task5A Patch

on:
  push:
    branches: [feature/naval-stage2-runtime]
    paths:
      - scripts/stage2-transport-task5a.mjs
      - .github/workflows/stage2-transport-task5a.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/stage2-transport-task5a.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/state/useExtensionState.ts src/owlbear/extensionServices.ts src/background/application.ts
          git diff --cached --quiet && exit 1
          git commit -m "feat: add role-safe transport views and embarked visibility"
          git push origin HEAD:feature/naval-stage2-runtime
