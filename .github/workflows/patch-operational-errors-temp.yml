name: Temporary operational error patcher

on:
  push:
    branches:
      - fix/post-stage2-hardening
    paths:
      - .github/workflows/patch-operational-errors-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch background operational error reporting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/background/application.ts')
          text = path.read_text()

          old = '''export class SceneWorkTracker {
            private readonly pending = new Set<Promise<void>>();

            track(work: Promise<unknown>): void {
              const tracked = work.then(() => undefined).finally(() => this.pending.delete(tracked));
              this.pending.add(tracked);
              void tracked.catch(() => undefined);
            }
'''
          new = '''export type BackgroundOperationalErrorReporter = (
            error: unknown,
            context: string
          ) => void;

          function defaultBackgroundOperationalErrorReporter(
            error: unknown,
            context: string
          ): void {
            console.error(`Letopis Armies background operation failed: ${context}`, error);
          }

          export class SceneWorkTracker {
            private readonly pending = new Set<Promise<void>>();

            constructor(
              private readonly reportError: BackgroundOperationalErrorReporter = defaultBackgroundOperationalErrorReporter
            ) {}

            track(work: Promise<unknown>): void {
              const tracked = work.then(() => undefined).finally(() => this.pending.delete(tracked));
              this.pending.add(tracked);
              void tracked.catch((error: unknown) => this.reportError(error, "scene-work"));
            }
'''
          if old not in text:
              raise SystemExit('SceneWorkTracker target not found')
          text = text.replace(old, new, 1)

          old = '''  constructor(
              private readonly port: OwlbearPort,
              private readonly wallClock: () => Date = () => new Date()
            ) {
'''
          new = '''  constructor(
              private readonly port: OwlbearPort,
              private readonly wallClock: () => Date = () => new Date(),
              private readonly reportOperationalError: BackgroundOperationalErrorReporter = defaultBackgroundOperationalErrorReporter
            ) {
'''
          if old not in text:
              raise SystemExit('ProductionEngine constructor target not found')
          text = text.replace(old, new, 1)

          old = '''    } catch {
              return;
            }
            const armyCells = Object.fromEntries'''
          new = '''    } catch (error) {
              this.reportOperationalError(error, "turn-grid-unavailable");
              return;
            }
            const armyCells = Object.fromEntries'''
          if old not in text:
              raise SystemExit('turn grid catch target not found')
          text = text.replace(old, new, 1)

          old = '''    } catch {
              return;
            }
            const frames: Array<{'''
          new = '''    } catch (error) {
              this.reportOperationalError(error, "movement-grid-unavailable");
              return;
            }
            const frames: Array<{'''
          if old not in text:
              raise SystemExit('movement grid catch target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/application.ts
          git commit -m "fix: report background operational failures"
          git push
