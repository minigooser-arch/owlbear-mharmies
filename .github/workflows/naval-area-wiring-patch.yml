name: Apply naval area wiring patch

on:
  push:
    branches:
      - feature/naval-battle-request-runtime
    paths:
      - .github/workflows/naval-area-wiring-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-battle-request-runtime
      - name: Patch runtime wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          ext = "src/owlbear/extensionServices.ts"
          replace_once(ext,
          'import { SHIP_CLASSES } from "../naval/ships/shipClasses";\n',
          'import { SHIP_CLASSES } from "../naval/ships/shipClasses";\nimport { buildRequestBackedNavalBattleStart, parseNavalBattleAreaDraft } from "./navalBattleAreaBridge";\n')

          replace_once(ext,
          '  MAP_BRUSH_TOOL_ID,\n  MAP_BRUSH_TOOL_MODE_ID,\n  ROUTE_ARMY_ID_KEY,',
          '  MAP_BRUSH_TOOL_ID,\n  MAP_BRUSH_TOOL_MODE_ID,\n  NAVAL_BATTLE_AREA_DRAFT_CHANNEL,\n  NAVAL_BATTLE_AREA_REQUEST_ID_KEY,\n  NAVAL_BATTLE_AREA_SESSION_ID_KEY,\n  NAVAL_BATTLE_AREA_TOOL_ID,\n  NAVAL_BATTLE_AREA_TOOL_MODE_ID,\n  ROUTE_ARMY_ID_KEY,')

          replace_once(ext,
          '''    observedLocalCloneSourceIds = localCloneSourceIds(localItems);\n    return buildRoleSafeSnapshot({\n      role,\n      playerId,\n      scene: migrated.value,\n      players,\n      armies,\n      ships,\n      mapVisibleSourceIds: observedLocalCloneSourceIds\n    });''',
          '''    observedLocalCloneSourceIds = localCloneSourceIds(localItems);\n    const nextSnapshot = buildRoleSafeSnapshot({\n      role,\n      playerId,\n      scene: migrated.value,\n      players,\n      armies,\n      ships,\n      mapVisibleSourceIds: observedLocalCloneSourceIds\n    });\n    const currentDraft = snapshot.navalBattleAreaDraft;\n    const keepDraft = role === "GM" && currentDraft !== undefined &&\n      nextSnapshot.pendingNavalBattleRequests?.some((request) => request.id === currentDraft.requestId) === true;\n    return keepDraft\n      ? {\n          ...nextSnapshot,\n          navalBattleAreaDraft: {\n            requestId: currentDraft.requestId,\n            cells: currentDraft.cells.map((cell) => ({ ...cell }))\n          }\n        }\n      : nextSnapshot;''')

          replace_once(ext,
          '''  unsubscribers.push(\n    OBR.scene.onReadyChange(triggerRefresh),\n    OBR.scene.items.onChange(triggerRefresh),\n    OBR.scene.local.onChange(triggerLocalRefresh),\n    OBR.scene.onMetadataChange(triggerRefresh),\n    OBR.player.onChange(triggerRefresh),\n    OBR.party.onChange(triggerRefresh)\n  );\n  refreshCoordinator.request();''',
          '''  unsubscribers.push(\n    OBR.scene.onReadyChange(triggerRefresh),\n    OBR.scene.items.onChange(triggerRefresh),\n    OBR.scene.local.onChange(triggerLocalRefresh),\n    OBR.scene.onMetadataChange(triggerRefresh),\n    OBR.player.onChange(triggerRefresh),\n    OBR.party.onChange(triggerRefresh),\n    adapter.on(NAVAL_BATTLE_AREA_DRAFT_CHANNEL, (event) => {\n      if (snapshot.role !== "GM") return;\n      const draft = parseNavalBattleAreaDraft(event.data, snapshot.playerId);\n      if (!draft) return;\n      if (!snapshot.pendingNavalBattleRequests?.some((request) => request.id === draft.requestId)) return;\n      publish({ ...snapshot, navalBattleAreaDraft: draft });\n    })\n  );\n  refreshCoordinator.request();''')

          replace_once(ext,
          '''  await refreshCoordinator.whenIdle();\n\n  const send = async (command: UiCommand): Promise<unknown> => {\n    try {\n      if (command.type === "OPEN_MAP_BRUSH") {''',
          '''  await refreshCoordinator.whenIdle();\n  let navalBattleAreaReturnToolId: string | undefined;\n\n  const send = async (command: UiCommand): Promise<unknown> => {\n    try {\n      if (command.type === "OPEN_NAVAL_BATTLE_AREA") {\n        if (snapshot.role !== "GM") {\n          await notifyRussian(adapter, "GM_ONLY");\n          return undefined;\n        }\n        const returnToolId = await OBR.tool.getActiveTool();\n        navalBattleAreaReturnToolId = returnToolId === NAVAL_BATTLE_AREA_TOOL_ID\n          ? navalBattleAreaReturnToolId\n          : returnToolId;\n        await OBR.tool.setMetadata(NAVAL_BATTLE_AREA_TOOL_ID, {\n          [NAVAL_BATTLE_AREA_REQUEST_ID_KEY]: command.requestId,\n          [NAVAL_BATTLE_AREA_SESSION_ID_KEY]: crypto.randomUUID()\n        });\n        await OBR.tool.activateTool(NAVAL_BATTLE_AREA_TOOL_ID);\n        await OBR.tool.activateMode(NAVAL_BATTLE_AREA_TOOL_ID, NAVAL_BATTLE_AREA_TOOL_MODE_ID);\n        return undefined;\n      }\n      if (command.type === "OPEN_MAP_BRUSH") {''')

          replace_once(ext,
          '''      let payload: ArmyCommandPayload;\n      if (command.type === "REGISTER_SELECTED_ARMY") {''',
          '''      let payload: ArmyCommandPayload;\n      if (command.type === "START_NAVAL_BATTLE_FROM_REQUEST") {\n        payload = buildRequestBackedNavalBattleStart({\n          battleId: crypto.randomUUID(),\n          requestId: command.requestId,\n          initiatingShipId: command.initiatingShipId,\n          targetShipId: command.targetShipId,\n          participantShipIds: command.participantShipIds,\n          areaCells: command.areaCells\n        });\n      } else if (command.type === "REGISTER_SELECTED_ARMY") {''')

          replace_once(ext,
          '''      } else {\n        refreshCoordinator.request();\n        await refreshCoordinator.whenIdle();\n      }\n      return acknowledgement;''',
          '''      } else {\n        if (command.type === "START_NAVAL_BATTLE_FROM_REQUEST" && navalBattleAreaReturnToolId) {\n          await OBR.tool.activateTool(navalBattleAreaReturnToolId);\n          navalBattleAreaReturnToolId = undefined;\n        }\n        refreshCoordinator.request();\n        await refreshCoordinator.whenIdle();\n      }\n      return acknowledgement;''')

          app = "src/background/application.ts"
          replace_once(app,
          'import { MapBrushToolService } from "./mapBrushToolService";\nimport { registerMapBrushTool, type MapBrushToolRegistration } from "../owlbear/mapBrushTool";\n',
          'import { MapBrushToolService } from "./mapBrushToolService";\nimport { NavalBattleAreaToolService } from "./navalBattleAreaToolService";\nimport { registerMapBrushTool, type MapBrushToolRegistration } from "../owlbear/mapBrushTool";\nimport { registerNavalBattleAreaTool, type NavalBattleAreaToolRegistration } from "../owlbear/navalBattleAreaTool";\n')

          replace_once(app,
          '''    METADATA_KEYS.navalShipOverlay,\n    METADATA_KEYS.mapBrushPreview\n  ];''',
          '''    METADATA_KEYS.navalShipOverlay,\n    METADATA_KEYS.mapBrushPreview,\n    METADATA_KEYS.navalBattleAreaPreview\n  ];''')

          replace_once(app,
          '''  let removeMapBrushTool: MapBrushToolRegistration;\n  try {\n    removeMapBrushTool = await registerMapBrushTool(\n      OBR.tool,\n      new MapBrushToolService(toolPort, routeGateway),\n      `${import.meta.env.BASE_URL}icon-1.2.png`\n    );\n  } catch (error) {\n    await removeShipRouteTool();\n    await removeRouteTool();\n    routeGateway.stop();\n    throw error;\n  }\n  const coordinatorListeners''',
          '''  let removeMapBrushTool: MapBrushToolRegistration;\n  try {\n    removeMapBrushTool = await registerMapBrushTool(\n      OBR.tool,\n      new MapBrushToolService(toolPort, routeGateway),\n      `${import.meta.env.BASE_URL}icon-1.2.png`\n    );\n  } catch (error) {\n    await removeShipRouteTool();\n    await removeRouteTool();\n    routeGateway.stop();\n    throw error;\n  }\n  let removeNavalBattleAreaTool: NavalBattleAreaToolRegistration;\n  try {\n    removeNavalBattleAreaTool = await registerNavalBattleAreaTool(\n      OBR.tool,\n      new NavalBattleAreaToolService(toolPort),\n      `${import.meta.env.BASE_URL}icon-1.2.png`\n    );\n  } catch (error) {\n    await removeMapBrushTool();\n    await removeShipRouteTool();\n    await removeRouteTool();\n    routeGateway.stop();\n    throw error;\n  }\n  const coordinatorListeners''')

          replace_once(app,
          '''        try {\n          await removeMapBrushTool();\n          await removeShipRouteTool();\n          await removeRouteTool();\n        } finally {''',
          '''        try {\n          await removeNavalBattleAreaTool();\n          await removeMapBrushTool();\n          await removeShipRouteTool();\n          await removeRouteTool();\n        } finally {''')

          test = "src/background/application.test.ts"
          replace_once(test,
          '''    {\n      id: "health",\n      type: "LABEL",\n      position: { x: 0, y: 0 },\n      metadata: { [METADATA_KEYS.healthOverlay]: { armyId: "army" } }\n    },\n    {\n      id: "keep",''',
          '''    {\n      id: "health",\n      type: "LABEL",\n      position: { x: 0, y: 0 },\n      metadata: { [METADATA_KEYS.healthOverlay]: { armyId: "army" } }\n    },\n    {\n      id: "naval-area-preview",\n      type: "CURVE",\n      position: { x: 0, y: 0 },\n      metadata: { [METADATA_KEYS.navalBattleAreaPreview]: { cellKey: "1,1" } }\n    },\n    {\n      id: "keep",''')
          replace_once(test,
          '  ])).toEqual(["route-preview", "map-brush-preview", "health"]);',
          '  ])).toEqual(["route-preview", "map-brush-preview", "health", "naval-area-preview"]);')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "minigooser-arch"
          git config user.email "minigooser@gmail.com"
          git add src/owlbear/extensionServices.ts src/background/application.ts src/background/application.test.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: wire naval battle area selection runtime"
            git push origin HEAD:feature/naval-battle-request-runtime
          fi
