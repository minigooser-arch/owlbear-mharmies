name: Apply destroyed tactical guard

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - scripts/apply-destroyed-tactical-guard.py
      - .github/workflows/apply-destroyed-tactical-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
      - name: Apply tactical guard
        run: python scripts/apply-destroyed-tactical-guard.py
      - name: Remove one-shot patch files
        run: rm scripts/apply-destroyed-tactical-guard.py .github/workflows/apply-destroyed-tactical-guard.yml
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Patch produced no changes"; exit 1; }
          git commit -m "fix: reject tactical commands from destroyed ships"
          git push origin HEAD:feature/naval-combat-v1
