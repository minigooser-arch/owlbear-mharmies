name: Apply deleted side reveal cleanup

on:
  push:
    branches: [feature/naval-combat-v1]
    paths:
      - .github/workflows/apply-deleted-side-reveal-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply deleted side reveal cleanup
        run: python3 scripts/apply-deleted-side-reveal-cleanup.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-deleted-side-reveal-cleanup.py .github/workflows/apply-deleted-side-reveal-cleanup.yml
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands/commandProcessor.ts
          git commit -m "fix: clear deleted side naval reveal map"
          git push origin HEAD:feature/naval-combat-v1
