name: Apply Stage 2 manual sync

on:
  push:
    branches:
      - feature/naval-stage2-runtime
    paths:
      - scripts/apply-stage2-manual-sync.py
      - .github/workflows/apply-stage2-manual-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synchronize manual
        run: python scripts/apply-stage2-manual-sync.py
      - name: Commit manual update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual-four-client-test.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: update Stage 2 manual scenarios"
          git push origin HEAD:feature/naval-stage2-runtime
