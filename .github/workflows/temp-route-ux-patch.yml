name: Temporary route UX patch

on:
  push:
    branches:
      - fix/army-hp-and-route-planning

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply type fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/owlbear/routeToolIntegration.ts')
          text = path.read_text()
          old = '    onClick: () => { void enqueue(commitCurrentRoute); }\n'
          new = '    onClick: () => { void enqueue(async () => { await commitCurrentRoute(); }); }\n'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/owlbear/routeToolIntegration.ts
          git commit -m "fix: adapt route finish helper to queue contract"
          git push
