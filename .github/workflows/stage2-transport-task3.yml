name: Stage2 Transport Task3 Patch

on:
  push:
    branches: [feature/naval-stage2-runtime]
    paths:
      - scripts/stage2-transport-task3.mjs
      - .github/workflows/stage2-transport-task3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/stage2-transport-task3.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/types.ts src/shared/validation.ts src/commands/commandValidation.ts src/commands/commandProcessor.ts src/background/application.ts src/commands/transportCommands.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "feat: add authoritative transport landing runtime"
          git push origin HEAD:feature/naval-stage2-runtime
