name: Fix Post Movement Completion Expectations

on:
  push:
    branches: [feature/naval-stage2-runtime]
    paths:
      - scripts/fix-post-movement-completion-expectations.mjs
      - .github/workflows/fix-post-movement-completion-expectations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-stage2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/fix-post-movement-completion-expectations.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/naval/battle/navalBattleLifecycle.test.ts src/commands/navalBattleCompletionCommands.test.ts src/background/navalBattleCompletionPersistenceIntegration.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "test: expect post-movement after naval completion"
          git push origin HEAD:feature/naval-stage2-runtime
