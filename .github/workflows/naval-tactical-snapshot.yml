name: Naval tactical snapshot

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - scripts/apply-naval-tactical-snapshot.py
      - .github/workflows/naval-tactical-snapshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - name: Apply tactical snapshot mapping
        run: python scripts/apply-naval-tactical-snapshot.py
      - name: Commit tactical snapshot mapping
        run: |
          rm -f scripts/apply-naval-tactical-snapshot.py .github/workflows/naval-tactical-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose role-safe naval tactical state"
          git push origin HEAD:feature/naval-combat-v1
