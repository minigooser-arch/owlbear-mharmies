name: Apply ship persistence green patch

on:
  push:
    branches:
      - feature/naval-combat-v1
    paths:
      - .github/workflows/ship-persistence-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naval-combat-v1
          fetch-depth: 0
      - run: python scripts/apply-ship-persistence-green.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/validation.ts src/storage/migrations.ts src/storage/metadataRepository.ts src/background/application.ts
          git rm scripts/apply-ship-persistence-green.py
          git rm .github/workflows/ship-persistence-green.yml
          git commit -m "feat: persist registered ships on tokens"
          git push origin HEAD:feature/naval-combat-v1
